<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231865f2'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Top's Academy</title>
    <!--COURSE_MANIFEST-->
    <meta name="application-name" content="Top's Academy" />
    <meta name="theme-color" content="#1865f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Top's Academy" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Top's Academy" />
    <meta property="og:site_name" content="Top's Academy" />
    <meta property="og:description" content="Top's Academy Practice Platform" />
    <meta name="twitter:title" content="Top's Academy" />
    <script>
      (function () {
        var l = window.location;
        if (l.search && l.search.indexOf('?p=') === 0) {
          var decoded = {};
          l.search.slice(1).split('&').forEach(function (part) {
            var idx = part.indexOf('=');
            if (idx !== -1) {
              decoded[part.slice(0, idx)] = part.slice(idx + 1).replace(/~and~/g, '&');
            }
          });
          if (decoded.p !== undefined) {
            var base = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
            var newUrl = base + decoded.p + (decoded.q ? '?' + decoded.q : '') + l.hash;
            window.history.replaceState(null, '', newUrl);
          }
        }
      })();
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
  </head>
  <body class="bg-[#fafbfc] text-[#21242c] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
